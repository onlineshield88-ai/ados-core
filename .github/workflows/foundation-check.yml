name: Foundation Check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Required Files
        run: |
          test -f README.md
          test -f MASTER_INDEX.md
          test -f AGENTS.md
          test -f ROADMAP.md
          test -f TODO.md
          test -f VERSION
          test -f .gitignore
